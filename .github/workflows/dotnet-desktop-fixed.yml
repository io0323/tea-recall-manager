name: .NET Desktop CI (fixed)

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

env:
  Solution_Name: TeaRecallManager.sln
  Test_Project_Path: Tests/TeaRecallManager.Tests.csproj
  Wap_Project_Directory: TeaRecallManager
  Wap_Project_Path: TeaRecallManager.csproj

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Clear NuGet caches
        run: dotnet nuget locals all --clear

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj','**/*.sln') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Ensure clean state
        run: dotnet clean "${{ env.Solution_Name }}" --configuration Release || true

      - name: Restore (solution)
        # Use Bash on Windows runner to allow bash-style for loop retry logic
        shell: bash
        run: |
          for i in 1 2 3; do
            dotnet restore "${{ env.Solution_Name }}" && break || sleep $((i*5))
          done

      # Build and test Core & Tests first to isolate cross-platform issues (avoid restoring WPF-specific packages early)
      - name: Restore Tests
        run: dotnet restore "${{ env.Test_Project_Path }}"

      - name: Dump workspace listing before Core build (diagnostic)
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Force | Select-Object FullName | Out-File -FilePath pre_build_workspace_listing.txt -Encoding utf8
      - name: Upload pre-build workspace listing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre_build_workspace_listing
          path: pre_build_workspace_listing.txt

      - name: Build Core
        run: dotnet build TeaRecallManager.Core/TeaRecallManager.Core.csproj --configuration Release --no-restore /bl:TeaRecallManager.Core.binlog
      - name: Dump workspace listing (for diagnostics)
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Force | Select-Object FullName | Out-File -FilePath workspace_listing.txt -Encoding utf8
      - name: Upload Core binlog (if produced)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TeaRecallManager.Core.binlog
          path: TeaRecallManager.Core.binlog
      - name: Upload workspace listing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TeaRecallManager.Core.workspace_listing
          path: workspace_listing.txt
      - name: Build Tests
        run: dotnet build "${{ env.Test_Project_Path }}" --configuration Release --no-restore

      - name: Test (Core)
        run: dotnet test "${{ env.Test_Project_Path }}" --configuration Release --no-build --verbosity normal

      - name: Build (solution) with retry
        shell: bash
        run: |
          for i in 1 2 3; do
            dotnet build "${{ env.Solution_Name }}" --configuration Release --no-restore && break || sleep $((i*5))
          done

