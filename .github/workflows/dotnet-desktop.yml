name: .NET Desktop CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

env:
  # 実際のソリューション/プロジェクトファイル名を指定
  Solution_Name: TeaRecallManager.csproj
  Test_Project_Path: Tests/TeaRecallManager.Tests.csproj
  Wap_Project_Directory: TeaRecallManager
  Wap_Project_Path: TeaRecallManager.csproj

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore "${{ env.Solution_Name }}"

      - name: Build
        run: dotnet build "${{ env.Solution_Name }}" --configuration Release --no-restore

      - name: Test
        run: dotnet test "${{ env.Test_Project_Path }}" --no-build --verbosity normal

